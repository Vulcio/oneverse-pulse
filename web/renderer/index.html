<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oneverse Pulse — Development Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080d1a;color:#fff;font-family:system-ui,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw;box-sizing:border-box}
h1{font-size:clamp(24px,4vw,64px);color:#9bc4ff} p{font-size:clamp(30px,5vw,80px);margin:.15em}
small{position:fixed;bottom:1.5em;color:#a5b2cc;font-size:16px}
</style></head><body>
<main><h1 id="title">Loading…</h1><div id="lines"></div><small id="status">Offline demo · ← / → to navigate</small></main>
<script>
let previous = "";
async function refresh(){
 try{
  const response = await fetch('/api/state',{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const state=await response.json();
  const slide=state.set.slides[state.index];
  const fingerprint=JSON.stringify([state.index,slide]);
  if(fingerprint!==previous){
   document.getElementById('title').textContent=slide?.title??'No slide';
   const lines=document.getElementById('lines');lines.replaceChildren();
   for(const line of slide?.lines??[]){const p=document.createElement('p');p.textContent=line;lines.append(p);}
   previous=fingerprint;
  }
  document.getElementById('status').textContent=state.set.title+' · '+(state.index+1)+'/'+state.set.slides.length+' · ← / →';
 }catch(error){document.getElementById('status').textContent='Local Pulse unavailable';}
}
document.addEventListener('keydown',async event=>{
 const endpoint=event.key==='ArrowRight'?'/api/next':event.key==='ArrowLeft'?'/api/previous':null;
 if(endpoint){event.preventDefault();await fetch(endpoint,{method:'POST'});await refresh();}
});
refresh();setInterval(refresh,250);
</script></body></html>
