name: Rust CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 -m py_compile tools/make-screen-manifest.py tools/engine-manifest.py
      - run: bash -n appliance/install.sh tools/package-engine.sh tools/package-appliance.sh
      - run: sh -n appliance/kiosk/launch.sh tools/package-upstream-screen.sh
      - run: python3 -m unittest discover -s tools/tests
  release:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install Debian stable build tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo build --locked --release -p pulsed --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: pulsed-debian-trixie-x86_64
          path: target/x86_64-unknown-linux-gnu/release/pulsed
          if-no-files-found: error
  engine:
    runs-on: ubuntu-latest
    # Same Linux baseline as the mini PC; the runtime and dependencies are in the archive.
    container: debian:trixie-slim
    env:
      ONEVERSE_REVISION: c739fce529f59acbafa8bc3614ef33425d0dca02
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential python3 xz-utils
      - uses: actions/checkout@v4
        with:
          path: pulse
      - uses: actions/checkout@v4
        with:
          repository: Vulcio/Oneverse
          ref: ${{ env.ONEVERSE_REVISION }}
          path: Oneverse
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build installable appliance archive
        working-directory: pulse
        run: bash tools/package-appliance.sh ../Oneverse /tmp/oneverse-pulse-debian13-x86_64.tar.gz "$ONEVERSE_REVISION"
      - name: Exercise packaged engine with a local cloud
        working-directory: pulse
        run: |
          mkdir /tmp/pulse-release
          tar -xzf /tmp/oneverse-pulse-debian13-x86_64.tar.gz -C /tmp/pulse-release
          export PULSE_TEST_ENGINE_DIR=/tmp/pulse-release/oneverse-pulse/engine
          export PULSE_TEST_BINARY=/tmp/pulse-release/oneverse-pulse/bin/pulsed
          python3 -m unittest discover -s tools/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: oneverse-pulse-debian13-x86_64
          path: /tmp/oneverse-pulse-debian13-x86_64.tar.gz
          if-no-files-found: error
