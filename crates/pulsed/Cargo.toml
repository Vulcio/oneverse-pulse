[package]
name = "pulsed"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
pulse-core = { path = "../pulse-core" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
